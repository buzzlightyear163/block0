name: Bundle Index

# Samples new pump.fun launches and updates data/index.json.
# Every 2 hours keeps it inside GitHub's free minutes even for a private repo.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-index
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read block 0 of new launches
        run: node scripts/bundle-index.mjs
      - name: Save the sample
        run: |
          git config user.name "even-index-bot"
          git config user.email "even-index-bot@users.noreply.github.com"
          git add data/index.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Bundle Index sample"
          git pull --rebase --autostash
          git push
